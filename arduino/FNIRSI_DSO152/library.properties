sentence=Complete Arduino & FreeRTOS hardware library for the FNIRSI DSO-152 handheld oscilloscope (CH32F103 / STM32F103C8T6).
paragraph=Provides an Adafruit_GFX-compatible 16-bit parallel ST7789 display driver, Analog Front-End (AFE) attenuator/multiplexer control, high-speed ADC sampling, 9-button input polling, soft battery power latch (PC10), and one-call reboot into the DSO BOOT USB Mass Storage bootloader. Compatible with STM32duino and STM32FreeRTOS.
category=Device Control
